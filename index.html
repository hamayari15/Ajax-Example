<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Headlines</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">📰 News Headlines</span>
    </div>
  </nav>

  <section class="filters bg-white border-bottom py-3 mb-4">
    <div class="container">
      <form id="filterForm" class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <label for="countrySelect" class="form-label mb-1">Country</label>
          <select id="countrySelect" class="form-select"></select>
        </div>
        <div class="col-12 col-md-4">
          <label for="categorySelect" class="form-label mb-1">Category</label>
          <select id="categorySelect" class="form-select"></select>
        </div>
        <div class="col-12 col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-fill">Apply</button>
          <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </section>

  <main class="container">
    <p id="resultInfo" class="text-muted small"></p>
    <div id="status" class="text-center my-5" aria-live="polite"></div>
    <div id="news" class="row g-4"></div>
  </main>

  <footer class="text-center text-muted py-4 small">
    Powered by <a href="https://newsapi.org" target="_blank" rel="noopener">NewsAPI.org</a>
  </footer>

  <script src="config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
